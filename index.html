<html lang="ja">
<head>

  <main class="container">

    <img src="https://placehold.co/120x120" alt="icon" class="avatar" />

    <h1 class="name">Your Name</h1>
    <p class="bio">短い自己紹介文を書きます</p>

    <!-- Links -->
    <div class="links">
      <a href="https://twitter.com" target="_blank" class="link">X / Twitter</a>
      <a href="https://instagram.com" target="_blank" class="link">X / Twitter</a>
      <a href="https://youtube.com" target="_blank" class="link">X / Twitter</a>
      <!--<a href="https://example.com" target="_blank" class="link">メッセージへのご回答</a>-->
    </div>

    <!-- Form -->
    <section class="form-section">
      <form id="message-form">
        <label for="message" class="form-label">メッセージ</label>
        <textarea
          id="message"
          name="message"
          placeholder="ご自由にご記入ください"
          rows="5"
        ></textarea>
        <!--<button type="submit" class="submit-btn">送信</button>-->
        <input class="submitBtn" type="button" value="送信" onclick="onClickSubmit()">
      </form>
    </section>

    <footer>
      <small>© 2025 Your Name</small>
    </footer>

  </main>

  <!-- Cookie Notice -->
  <div id="cookie-notice" class="cookie-notice">
    <span>このサイトではクッキーを使用しています。</span>
    <button id="cookie-close" aria-label="閉じる">×</button>
  </div>
