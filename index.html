  // draw：ページが読みこまれた際に実行される、1フレーム（1/60秒）ごとに実行される関数
  function draw() {
    
    // 背景の移り変わり
    /*if (0 === frameCount % 600) {
	     // 10ごとに明暗
	    let sum = 0
	    for (let i = 0; i < 6; i++){

      next_col_list[c_idx_2] = Math.abs(next_col_list[c_idx_2] + 1);

    else{

    now_col1 = color(next_col_list[0], next_col_list[1], next_col_list[2]);
	  now_col2 = color(next_col_list[4], next_col_lsist[4], next_col_list[5]);
    
	  */

    
    // 背景色を設定（p5.jsライブラリのグラデーションつくる機能
    setGradient(0, 0, width, height, now_col1, now_col2, Y_AXIS);
    noStroke();// 線や図形の輪郭線を描かなくする

    // 星を描く
    this.drawStar();

    // 花火を打ち上げる間隔を調整
    if (width/height < 1){
    	interval = 120
    }
    if (0 === frameCount % interval) {// === 厳密等価演算子：文字列が数値に変換されない、frameCount：表示されてきたフレーム数
      // 打ち上がるスピード
      let speed = random(10, 30);
      fireworks.push(new FireWork(random(width), height, 0, speed, 0.98));
    }

    for (let fw of fireworks) {
      // 打ち切った花火を処理対象から外す（配列から削除する）
      if (2 === fw.getType || 30000 < fw.getFrame) {// type2:爆発し終わったオブジェクト
        fireworks = fireworks.filter((n) => n !== fw);// 多分indexが現在のもの以上を取り除く？
        continue;
      }

      // 打ち上げアニメーションを呼び出す
      fw.fire();
    }
  }

  /*
  // クリックイベントで起動
  document.addEventListener('click', function(event) {
  console.log("fire!");
  });
  */

  // ページ読み込み時に実行
  window.addEventListener('load', function(){
      document.getElementById("body").addEventListener('touchstart', logTouchStart); // タッチ開始
      document.getElementById("body").addEventListener('touchend', logTouchEnd); // タッチ終了
  });

  function logTouchStart() {
    if( event.changedTouches[0] ) {
        // ブラウザタップ位置
        console.log("tap");
    }
  }

  function logTouchEnd() {
    // 打ち上げアニメーションを呼び出す
    let cnt_fw = random(1, 3);
    for (let j=0; j < cnt_fw; j++) {
    let speed = random(10, 30);
    fireworks.push(new FireWork(random(width), height, 0, speed, 0.98));
    for (let fw of fireworks) {
      if (2 === fw.getType || 30000 < fw.getFrame) {
        fireworks = fireworks.filter((n) => n !== fw);
        continue;
      }
      fw.fire();
    }
    }

    // ブラウザタップ位置
    client_X = event.changedTouches[0].clientX;
    client_Y = event.changedTouches[0].clientY;

    // タッチエフェクト
    let speed = random(10, 30); // 弾けるスピード
    effects.push(new Effect(client_X, client_Y, speed));

    for (let ef of effects) {
      // 打ち切った花火を処理対象から外す（配列から削除する）
      if (2 === ef.getType || 10000 < ef.getFrame) {
        effects = effects.filter((n) => n !== ef);
        continue;
      }

      // 打ち上げアニメーションを呼び出す
      ef.pop();
    }
  }
  
// ----------- ここからクラス -------------

  class FireWork {
    // 初期設定
    constructor(x, y, vx, vy, gv) {
      // フレームカウンター
      this.frame = 0;
      this.type = 0;
      this.next = 0;
      // 花火の色
      this.r = random(155) + 80;
      this.g = random(155) + 80;
      this.b = random(155) + 80;
      this.a = 255;

      // 初期位置
      this.x = x;
      this.y = y;

      // 玉の大きさ
      this.w = random(5, 10);// p5.jsの機能

      // 打ち上がる高さ
      this.maxHeight = random(height / 2, height / 9);
      this.fireHeight = height - this.maxHeight;

      // 重力
      this.vx = vx;
      this.vy = vy;
      this.gv = gv;

      // 残像表示用配列
      this.afterImages = [];
      // 爆発用配列
      this.explosions = [];

      // 消えてから爆発までの遅延時間
      this.exDelay = random(5, 20);
      // 爆発の大きさ
      this.large = random(5, 20);
      // 爆発の玉の数
      this.ball = random(20, 100);
      // 爆発から消えるまでの長さ
      this.exend = random(20, 40);
      // 爆発のブレーキ
      this.exStop = 0.96;
    }

    get getFrame() {
      return this.frame;
    }

    get getType() {
      return this.type;
    }

    // 処理コントロール
    fire() {
      // 0:打ち上げ（初期） 1:爆発
      switch (this.type) {
        case 0:
          this.rising();
          break;
        case 1:
          this.explosion();
          break;
      }
    }

// ----------- クラス終わり -------------

    // 打ち上げアニメーション
    rising() {
      // 頂点まで達したら消す
      if (this.y * 0.8 < this.maxHeight) {
        this.a = this.a - 6;
      }

      // 指定の高さまで上昇する
      this.x += this.vx;
      this.y -= this.vy * ((this.fireHeight - (height - this.y)) / this.fireHeight);

      // 残像を表示
      this.afterImages.push(new Afterimage(this.r, this.g, this.b, this.x, this.y, this.w, this.a));
      for (let ai of this.afterImages) {
        if (ai.getAlpha <= 0) {
          this.afterImages = this.afterImages.filter((n) => n !== ai);
          continue;
        }
        ai.rsImage();
      }

      // 打ち上げ表示
      this.update(this.x, this.y, this.w);

      // 全ての表示が消えたら処理の種類を変更する
      if (0 == this.afterImages.length) {
        if (0 === this.next) {
          // 消えてから爆発まで遅延させる
          this.next = this.frame + Math.round(this.exDelay);
        } else if (this.next === this.frame) {
          // 花火の大きさ
          for (let i = 0; i < this.ball; i++) {
            // 爆発の角度
            let r = random(0, 360);
            // 花火の内側を作る（バラバラ）
            let s = random(0.1, 0.9);
            let vx = Math.cos((r * Math.PI) / 180) * s * this.large;
            let vy = Math.sin((r * Math.PI) / 180) * s * this.large;
            this.explosions.push(new FireWork(this.x, this.y, vx, vy, this.exStop));
            // 花火の輪郭を作る（丸くなるようにする）
            let cr = random(0, 360);
            let cs = random(0.9, 1);
            let cvx = Math.cos((cr * Math.PI) / 180) * cs * this.large;
            let cvy = Math.sin((cr * Math.PI) / 180) * cs * this.large;
            this.explosions.push(new FireWork(this.x, this.y, cvx, cvy, this.exStop));
          }
          this.a = 255;
          this.type = 1;
        }
      }
    }

    // 爆発アニメーション
    explosion() {
      for (let ex of this.explosions) {
        ex.frame++;
        // 爆発し終わった花火を配列から除去する
        if (2 === ex.getType) {
          this.explosions = this.explosions.filter((n) => n !== ex);
          continue;
        }

        // 残像を描画
        if (0 === Math.round(random(0, 32))) {
          ex.afterImages.push(new Afterimage(this.r, this.g, this.b, ex.x, ex.y, ex.w, ex.a));
        }

        for (let ai of ex.afterImages) {
          if (ai.getAlpha < 0) {
            ex.afterImages = ex.afterImages.filter((n) => n !== ai);
            continue;
          }
          ai.exImage();
        }

        // 爆発を描画
        this.update(ex.x, ex.y, ex.w, ex.a);
        ex.x += ex.vx;
        ex.y += ex.vy;
        ex.vx = ex.vx * ex.gv;
        ex.vy = ex.vy * ex.gv;
        ex.vy = ex.vy + ex.gv / 30;
        if (this.exend < ex.frame) {
          ex.w -= 0.1;
          ex.a = ex.a - 4;
          if (ex.a < 0 && 0 === ex.afterImages.length) {
            ex.type = 2;
          }
        }
      }
    }

    // 花火を表示する
    update(x, y, w, a) {
      this.frame++;
      if (0 < this.a) {
        let c = color(this.r, this.g, this.b);
        c.setAlpha(a);
        fill(c);
        rect(x, y, w, w);
      }
    }
  }

  // 残像処理用クラス
  class Afterimage {
    constructor(r, g, b, x, y, w, a) {
      this.frame = 0;
      this.r = r;
      this.g = g;
      this.b = b;
      this.x = x;
      this.y = y;
      this.w = w;
      this.a = a;
      this.vx = random(-0.24, 0.24);
      this.vy = random(0.2, 0.8);
      this.vw = random(0.05, 0.2);
    }

    get getAlpha() {
      return this.a;
    }

    // 打ち上げ用
    rsImage() {
      if (0 < this.a) {
        this.update(this.r, this.g, this.b, this.x, this.y, this.w, this.a);
        this.r += 4;
        this.g += 4;
        this.b += 4;
        this.x = this.x + this.vx;
        this.y = this.y + this.vy;
        if (0 < this.w) {
          this.w = this.w - this.vw;
        }
        this.a = this.a - 4;
      }
    }

    // 爆発用
    exImage() {
      if (0 < this.a) {
        this.update(this.r, this.g, this.b, this.x, this.y, this.w, this.a);
        this.r += 2.5;
        this.g += 2.5;
        this.b += 2.5;
        this.x = this.x + this.vx;
        this.y = this.y + this.vy;
        if (0 < this.w) {
          this.w = this.w - this.vw;
        }
        this.a = this.a - 1.5;
      }
    }

    update(r, g, b, x, y, w, a) {
      this.frame++;
      let c = color(r, g, b);
      c.setAlpha(a);
      fill(c);
      rect(x, y, w, w);
    }
  }

  // グラデーションを描画
  function setGradient(x, y, w, h, c1, c2, axis) {
    noFill();

    if (axis === Y_AXIS) {
      // Top to bottom gradient
      for (let i = y; i <= y + h; i++) {
        let inter = map(i, y, y + h, 0, 1);
        let c = lerpColor(c1, c2, inter);
        stroke(c);
        line(x, i, x + w, i);
      }
    } else if (axis === X_AXIS) {
      // Left to right gradient
      for (let i = x; i <= x + w; i++) {
        let inter = map(i, x, x + w, 0, 1);
        let c = lerpColor(c1, c2, inter);
        stroke(c);
        line(i, y, i, y + h);
      }
    }
  }

  // 星を作成
  function preStar() {
    star = [];
    for (let i = 0; i < 50; i++) {
      star.push([random(width), random(height / 2), random(1, 4)]);
    }
  }

  // 星を描画
  function drawStar() {
    // 星を描く
    for (let s of star) {
      let c = color(random(150, 255), random(150, 255), 255);
      c.setAlpha(random(150, 200));
      fill(c);
      rect(s[0], s[1], s[2], s[2]);
    }
  }

  // ----------- ここからタッチエフェクト -------------

  class Effect {
    // 初期設定
    constructor(x, y, v) {
      // フレームカウンター
      this.frame = 0;
      this.type = 0;
      this.next = 0;
      // エフェクトの色
      this.r = random(155) + 80;
      this.g = random(155) + 80;
      this.b = random(155) + 80;
      this.a = 255;

      // タッチ座標
      this.x = x;
      this.y = y;

      // 玉の大きさ
      this.w = random(3, 5);// p5.jsの機能

      // 速度
      this.v = v;

      // 残像表示用配列
      this.afterImages = [];
      // 弾ける用配列
      this.pops = [];
      // 爆発の大きさ
      this.large = random(5, 15);
      // 爆発の玉の数
      this.ball = random(20, 100);
      // 爆発から消えるまでの長さ
      this.exend = random(20, 40);
    }
    get getFrame() {
      return this.frame;
    }
    get getType() {
      return this.type;
    }

    // 処理コントロール
    pop() {
      // 弾ける大きさ
      for (let i = 0; i < this.ball; i++) {
        // 角度
        let r = random(0, 360);
        // 玉の内側を作る（バラバラ）
        let s = random(0.1, 0.9);
        let v = Math.cos((r * Math.PI) / 180) * s * this.large;
        this.pops.push(new Effect(this.x, this.y, v));
        // 輪郭を作る（丸くなるようにする）
        let cr = random(0, 360);
        let cs = random(0.9, 1);
        let cv = Math.cos((cr * Math.PI) / 180) * cs * this.large;
        this.pops.push(new Effect(this.x, this.y, cv));
      }
      this.a = 255;
      this.type = 1;

      for (let p of this.pops) {
        p.frame++;  

        // 弾け終わったpopを配列から除去する
        if (2 === p.getType) {
          this.pop = this.pop.filter((n) => n !== p);
          continue;
        }

        // 残像を描画
        if (0 === Math.round(random(0, 32))) {
          p.afterImages.push(new E_Afterimage(this.r, this.g, this.b, p.x, p.y, p.w, p.a));
        }

        for (let ai of p.afterImages) {
          if (ai.getAlpha < 0) {
            p.afterImages = p.afterImages.filter((n) => n !== ai);
            continue;
          }
          ai.exImage();
        }

        // 弾けさせる
        this.update(p.x, p.y, p.w, p.a);
        p.x += p.v;
        p.y += p.v;
        p.vx = p.v * p.v;
        p.vy = p.v * p.v;
        p.vy = p.v + p.v / 30;
        if (this.exend < p.frame) {
          p.w -= 0.1;
          p.a = p.a - 4;
          if (p.a < 0 && 0 === p.afterImages.length) {
            p.type = 2;
          }
        }
      }
    }

    // エフェクトの描画
    update(x, y, w, a) {
      this.frame++;
      if (0 < this.a) {
        let c = color(this.r, this.g, this.b);
        c.setAlpha(a);
        fill(c);
        rect(x, y, w, w);
      }
    }
  }
  // 残像処理用クラス
  class E_Afterimage {
    constructor(r, g, b, x, y, w, a) {
      this.frame = 0;
      this.r = r;
      this.g = g;
      this.b = b;
      this.x = x;
      this.y = y;
      this.w = w;
      this.a = a;
      this.v = random(-0.24, 0.24);
    }

    get getAlpha() {
      return this.a;
    }

    // 爆発用
    exImage() {
      if (0 < this.a) {
        this.update(this.r, this.g, this.b, this.x, this.y, this.w, this.a);
        this.r += 2.5;
        this.g += 2.5;
        this.b += 2.5;
        this.x = this.x + this.v;
        this.y = this.y + this.v;
        if (0 < this.w) {
          this.w = this.w - this.v;
        }
        this.a = this.a - 1.5;
      }
    }
    update(r, g, b, x, y, w, a) {
      this.frame++;
      let c = color(r, g, b);
      c.setAlpha(a);
      fill(c);
      rect(x, y, w, w);
      
    }
  }
