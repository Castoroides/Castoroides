  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #38bdf8;        /* sky */
      --accent-2: #a78bfa;      /* violet */
      --accent-soft: #e0f2fe;   /* sky-100 */
      --ring: rgba(56,189,248,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      background:
        radial-gradient(600px 300px at 10% -10%, rgba(56,189,248,.25), transparent 60%),
        radial-gradient(500px 280px at 90% 10%, rgba(167,139,250,.22), transparent 60%),
        linear-gradient(180deg, #f0f9ff, var(--bg));
      color: var(--text);
      line-height: 1.7;
    }

    /* ===== Header ===== */
    header {
      padding: 56px 20px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 18px rgba(0,0,0,.08);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    header h1 {
      font-size: clamp(24px, 6.5vw, 34px);
      font-weight: 700;
      margin: 8px 0 10px;
      letter-spacing: .02em;
    }

    header p {
      color: var(--muted);
      font-size: 15px;
      margin: 0 auto;
      max-width: 560px;
    }

    /* ===== Layout ===== */
    main {
      max-width: 760px;
      margin: 0 auto 64px;
      padding: 0 16px;
    }

    /* ===== Card ===== */
    .card {
      position: relative;
      background: linear-gradient(180deg, #ffffff, #ffffff) padding-box,
                  linear-gradient(135deg, rgba(56,189,248,.35), rgba(167,139,250,.35)) border-box;
      border: 1px solid transparent;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(2,6,23,.12);
    }

    .card::after {
      content: '';
      position: absolute;
      inset: auto 12px -18px 12px;
      height: 36px;
      background: radial-gradient(60% 60% at 50% 50%, rgba(56,189,248,.25), transparent 70%);
      filter: blur(10px);
      z-index: -1;
    }

    /* ===== Intro ===== */
    .intro {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--accent-soft), #ffffff);
    }

    .intro h2 {
      font-size: 18px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,.08);
      color: var(--muted);
    }

    /* ===== Social proof ===== */
    .bubbles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 0 6px;
    }

    .bubble {
      background: #fff;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted);
      box-shadow: 0 8px 18px rgba(0,0,0,.08);
    }

    /* ===== Form ===== */
    .form-wrapper {
      position: relative;
      width: 100%;
      height: 760px;
      overflow: hidden;
      border-radius: 16px;
      background: #fff;
      outline: 3px solid transparent;
      transition: outline-color .2s ease;
    }

    .form-wrapper:focus-within {
      outline-color: var(--ring);
    }

    .form-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      padding: 28px 16px 44px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ===== Desktop tweaks ===== */
    @media (min-width: 768px) {
      header { padding-top: 72px; }
      .form-wrapper { height: 820px; }
      .bubbles { grid-template-columns: 1fr 1fr 1fr; }
    }
  

    /* ===== Cookie Banner ===== */
    .cookie-banner {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 1000;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 12px 28px rgba(0,0,0,.15);
      font-size: 13px;
      color: var(--muted);
    }

    .cookie-banner strong {
      color: var(--text);
      font-weight: 600;
    }

    @media (min-width: 768px) {
      .cookie-banner {
        max-width: 420px;
        right: 24px;
        left: auto;
      }
    }

  </style>
</head>
